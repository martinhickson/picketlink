name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      base_branch:
        description: 'Base branch to create release from'
        required: false
        default: '2.5.5-jakarta'
        type: string
      branch_name:
        description: 'Branch name for release (e.g., release/1.2.3)'
        required: true
        type: string
      release_tag:
        description: 'Git tag for release (e.g., 1.2.3)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      publish_packages:
        description: 'Publish to GitHub Packages'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run tests after build'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        server-username: ${{ github.repository_owner }}
        server-password: ${{ secrets.GITHUB_TOKEN }}
        settings-path: ${{ github.workspace }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Create or checkout release branch
      run: |
        BASE_BRANCH="${{ inputs.base_branch }}"
        BRANCH_NAME="${{ inputs.branch_name }}"
        
        # Fetch all branches
        git fetch origin
        
        # Checkout base branch
        git checkout ${BASE_BRANCH}
        git pull origin ${BASE_BRANCH}
        
        # Check if release branch exists
        if git show-ref --verify --quiet refs/heads/${BRANCH_NAME} || git show-ref --verify --quiet refs/remotes/origin/${BRANCH_NAME}; then
          echo "Release branch ${BRANCH_NAME} already exists, checking it out"
          git checkout ${BRANCH_NAME}
          git pull origin ${BRANCH_NAME} || true
        else
          echo "Creating new release branch ${BRANCH_NAME}"
          git checkout -b ${BRANCH_NAME}
        fi
    
    - name: Backup external parent POM versions
      id: backup_parents
      run: |
        # Find all external parent POMs and save their versions before versions:set
        echo "Backing up external parent POM versions..."
        # Create a backup file with parent versions
        find . -name "pom.xml" -type f | while read pomfile; do
          # Check if file has external parent (org.jboss, org.apache, etc.)
          if grep -q "<parent>" "$pomfile"; then
            PARENT_GROUP=$(grep -A 10 "<parent>" "$pomfile" | grep "<groupId>" | head -1 | sed 's/.*<groupId>\(.*\)<\/groupId>.*/\1/' | xargs)
            PARENT_ARTIFACT=$(grep -A 10 "<parent>" "$pomfile" | grep "<artifactId>" | head -1 | sed 's/.*<artifactId>\(.*\)<\/artifactId>.*/\1/' | xargs)
            PARENT_VERSION=$(grep -A 10 "<parent>" "$pomfile" | grep "<version>" | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | xargs)
            
            # Only backup if it's an external parent (not org.picketlink)
            if [ -n "$PARENT_GROUP" ] && [ "$PARENT_GROUP" != "org.picketlink" ] && [ -n "$PARENT_VERSION" ]; then
              echo "${pomfile}|${PARENT_GROUP}|${PARENT_ARTIFACT}|${PARENT_VERSION}" >> /tmp/parent_versions.txt
              echo "Backed up: $pomfile -> $PARENT_GROUP:$PARENT_ARTIFACT:$PARENT_VERSION"
            fi
          fi
        done
        echo "Parent versions backed up to /tmp/parent_versions.txt"
    
    - name: Update project versions
      run: |
        VERSION="${{ inputs.version }}"
        echo "Updating project version to ${VERSION}"
        
        # Use versions:set to update all module versions
        mvn versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false -DprocessParent=true
        
        # Update SCM tag in root pom.xml
        if [ -f pom.xml ]; then
          if grep -q "<tag>" pom.xml; then
            sed -i "s|<tag>.*</tag>|<tag>${VERSION}</tag>|g" pom.xml
          else
            # Add tag after <url> in <scm> section
            sed -i "s|</scm>|  <tag>${VERSION}</tag>\n  </scm>|" pom.xml
          fi
        fi
    
    - name: Restore external parent POM versions
      run: |
        echo "Restoring external parent POM versions..."
        if [ -f /tmp/parent_versions.txt ]; then
          while IFS='|' read -r pomfile parent_group parent_artifact parent_version; do
            if [ -f "$pomfile" ]; then
              echo "Restoring $parent_group:$parent_artifact:$parent_version in $pomfile"
              # Use a more robust sed command to restore the version
              sed -i "/<parent>/,/<\/parent>/ {
                /<groupId>${parent_group}<\/groupId>/,/<artifactId>${parent_artifact}<\/artifactId>/ {
                  /<version>/ {
                    s|<version>.*</version>|<version>${parent_version}</version>|
                  }
                }
              }" "$pomfile"
            fi
          done < /tmp/parent_versions.txt
          echo "External parent POM versions restored"
        else
          echo "No parent versions backup found, skipping restoration"
        fi
    
    - name: Verify external parent versions
      run: |
        echo "Verifying external parent POM versions..."
        # Check that jboss-parent versions are not the release version
        RELEASE_VERSION="${{ inputs.version }}"
        MISMATCHED=$(grep -r "<parent>" --include="pom.xml" -A 5 | \
          grep -B 2 -A 2 "jboss-parent" | \
          grep "<version>${RELEASE_VERSION}</version>" || true)
        if [ -n "$MISMATCHED" ]; then
          echo "WARNING: Found external parent POMs with release version!"
          echo "$MISMATCHED"
          exit 1
        fi
        echo "External parent POM versions verified"
    
    - name: Configure Maven for GitHub Packages
      # Maven needs this for dependency resolution during build
      run: |
        # Extract repository owner and name
        REPO_FULL="${{ github.repository }}"
        REPO_OWNER="${REPO_FULL%%/*}"
        REPO_NAME="${REPO_FULL#*/}"
        
        echo "Repository: ${REPO_OWNER}/${REPO_NAME}"
        
        # Replace placeholders in root pom.xml and BOM pom.xml with actual repository owner and name
        sed -i "s|GITHUB_REPO_OWNER|${REPO_OWNER}|g" pom.xml
        sed -i "s|GITHUB_REPO_NAME|${REPO_NAME}|g" pom.xml
        sed -i "s|GITHUB_REPO_OWNER|${REPO_OWNER}|g" bom/pom.xml
        sed -i "s|GITHUB_REPO_NAME|${REPO_NAME}|g" bom/pom.xml
        
        # Create complete settings.xml with authentication and repository configuration
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.repository_owner }}</username>
              <password>${{ secrets.GITHUB_TOKEN }}</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>github-packages</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <name>Maven Central Repository</name>
                  <url>https://repo1.maven.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
                <repository>
                  <id>jboss-public-repository-group</id>
                  <name>JBoss Public Maven Repository Group</name>
                  <url>https://repository.jboss.org/nexus/content/groups/public/</url>
                  <releases>
                    <enabled>true</enabled>
                    <updatePolicy>never</updatePolicy>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                    <updatePolicy>never</updatePolicy>
                  </snapshots>
                </repository>
                <repository>
                  <id>github</id>
                  <url>https://maven.pkg.github.com/${REPO_OWNER}/${REPO_NAME}</url>
                  <snapshots>
                    <enabled>true</enabled>
                  </snapshots>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>github-packages</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        
        echo "Created ~/.m2/settings.xml with GitHub Packages authentication"
        echo "Updated pom.xml and bom/pom.xml with GitHub Packages repository"
        echo "Verifying root pom.xml distributionManagement:"
        grep -A 5 '<distributionManagement>' pom.xml || echo "ERROR: distributionManagement not found!"
        echo "Verifying bom/pom.xml distributionManagement:"
        grep -A 5 '<distributionManagement>' bom/pom.xml || echo "ERROR: distributionManagement not found!"
        
        # Also verify that jboss-releases-repository is NOT present
        if grep -q "jboss-releases-repository" pom.xml || grep -q "jboss-releases-repository" bom/pom.xml; then
          echo "ERROR: jboss-releases-repository still found in POM files!"
          grep -n "jboss-releases-repository" pom.xml bom/pom.xml || true
          exit 1
        fi
        echo "Verified: No jboss-releases-repository found"
    
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        # Cache only Maven repository (downloaded dependencies), NOT source code or POM files
        # This cache does NOT affect POM file modifications made in previous steps
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-repo-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-repo-
          ${{ runner.os }}-m2-
    
    - name: Clear Maven cache of failed parent resolution
      run: |
        # Clear any cached "not found" entries for the parent POM
        # Use the release version from workflow input
        VERSION="${{ inputs.version }}"
        rm -rf ~/.m2/repository/org/picketlink/picketlink-parent/${VERSION} || true
        echo "Cleared cache for picketlink-parent:${VERSION}"
    
    - name: Install parent POM first
      run: |
        # Install the parent POM to local repository first so child modules can resolve it
        # Use -N flag to build only the root POM (non-recursive)
        mvn clean install -N \
          -s ~/.m2/settings.xml \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dcheckstyle.skip=true \
          -Dmaven.compiler.source=17 \
          -Dmaven.compiler.target=17 \
          -U
    
    - name: Build project
      run: |
        mvn clean install \
          -s ~/.m2/settings.xml \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dcheckstyle.skip=true \
          -Dmaven.compiler.source=17 \
          -Dmaven.compiler.target=17 \
          -U
    
    - name: Run tests
      if: inputs.run_tests == true
      run: |
        mvn test \
          -s ~/.m2/settings.xml \
          -Dcheckstyle.skip=true \
          -Dmaven.compiler.source=17 \
          -Dmaven.compiler.target=17
    
    - name: Package artifacts
      run: |
        mvn package \
          -s ~/.m2/settings.xml \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dcheckstyle.skip=true \
          -Dmaven.compiler.source=17 \
          -Dmaven.compiler.target=17
    
    - name: Publish to GitHub Packages
      if: inputs.publish_packages == true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Use the distributionManagement configured in pom.xml
        # The settings.xml has already been configured with authentication
        mvn deploy \
          -s ~/.m2/settings.xml \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dcheckstyle.skip=true \
          -Dmaven.compiler.source=17 \
          -Dmaven.compiler.target=17
    
    - name: Commit version changes
      run: |
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Release version ${{ inputs.version }}"
          git push origin ${{ inputs.branch_name }}
        fi
    
    - name: Create Git tag
      id: create_tag
      run: |
        TAG="${{ inputs.release_tag }}"
        
        # Check if tag already exists
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Creating tag $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create GitHub Release
      if: inputs.create_release == true && steps.create_tag.outputs.tag_exists == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.release_tag }}
        name: Release ${{ inputs.release_tag }}
        body: |
          Release ${{ inputs.release_tag }}
          
          ## Changes
          - Version updated to ${{ inputs.version }}
          
          ## Artifacts
          See attached build artifacts.
        draft: false
        prerelease: false
        files: |
          **/target/*.jar
          **/target/*.war
          **/target/*.pom
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ inputs.version }}
        path: |
          **/target/*.jar
          **/target/*.war
          **/target/*.pom
        retention-days: 30

