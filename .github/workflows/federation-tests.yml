name: Federation unit tests

on:
  push:
    branches: [2.5.5]
  pull_request:
    branches: [2.5.5]
  workflow_dispatch:

jobs:
  federation-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PicketLink
        uses: actions/checkout@v4

      - name: Checkout PicketBox 5.0.3.jdk17.1
        uses: actions/checkout@v4
        with:
          repository: martinhickson/picketbox
          ref: 5.0.3
          path: .ci/picketbox

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install PicketBox
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -f .ci/picketbox/pom.xml
          -pl picketbox -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Build federation dependencies
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Run federation unit tests
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation
          test
          -Dcheckstyle.skip=true
          -Denforcer.skip=true
