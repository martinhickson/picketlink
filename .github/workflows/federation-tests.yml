name: Federation unit tests

on:
  push:
    branches: [2.5.5]
  pull_request:
    branches: [2.5.5]
  workflow_dispatch:

jobs:
  federation-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout PicketLink
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build federation dependencies
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Run federation unit tests
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation
          test
          -Dcheckstyle.skip=true
          -Denforcer.skip=true
          -Dsurefire.jvm.opens="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.security=ALL-UNNAMED"
