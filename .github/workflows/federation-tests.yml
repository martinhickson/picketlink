name: Federation unit tests

on:
  push:
    branches: [2.5.5]
  pull_request:
    branches: [2.5.5]
  workflow_dispatch:

jobs:
  federation-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PicketLink
        uses: actions/checkout@v5

      - name: Checkout PicketBox 5.0.3.jdk17.1
        uses: actions/checkout@v5
        with:
          repository: martinhickson/picketbox
          ref: 5.0.3
          path: .ci/picketbox

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # PicketBox 5.0.3.jdk17.1 is not published to Maven Central. JDK 17 does
      # not include javax.annotation.Generated, which its logging processor
      # loads, so the checked-out build gets that API on the compile classpath.
      # The shaded org.picketbox:picketbox jar is what federation depends on.
      - name: Install PicketBox
        run: |
          awk '
            /<dependencyManagement>/ && !inserted {
              print "    <dependencies>"
              print "        <dependency>"
              print "            <groupId>javax.annotation</groupId>"
              print "            <artifactId>javax.annotation-api</artifactId>"
              print "            <version>1.3.2</version>"
              print "            <scope>provided</scope>"
              print "        </dependency>"
              print "    </dependencies>"
              print ""
              inserted = 1
            }
            { print }
          ' .ci/picketbox/pom.xml > .ci/picketbox/pom.xml.generated
          mv .ci/picketbox/pom.xml.generated .ci/picketbox/pom.xml
          mvn -B -s .github/maven-ci-settings.xml \
            -f .ci/picketbox/pom.xml \
            -pl picketbox,security-jboss-sx/jbosssx,security-spi/spi -am \
            install \
            -Dmaven.test.skip=true \
            -Dcheckstyle.skip=true \
            -Denforcer.skip=true
          version=5.0.3.jdk17.1
          repo="${HOME}/.m2/repository/org/picketbox"
          mvn -B -s .github/maven-ci-settings.xml install:install-file \
            -Dfile="${repo}/jbosssx-bare/${version}/jbosssx-bare-${version}.jar" \
            -DgroupId=org.picketbox -DartifactId=jbosssx -Dversion="${version}" -Dpackaging=jar
          mvn -B -s .github/maven-ci-settings.xml install:install-file \
            -Dfile="${repo}/picketbox-spi-bare/${version}/picketbox-spi-bare-${version}.jar" \
            -DgroupId=org.picketbox -DartifactId=jboss-security-spi -Dversion="${version}" -Dpackaging=jar
          mvn -B -s .github/maven-ci-settings.xml \
            -f .ci/picketbox/pom.xml \
            -pl dist -am \
            install \
            -Dmaven.test.skip=true \
            -Dcheckstyle.skip=true \
            -Denforcer.skip=true

      - name: Build federation dependencies
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Run federation unit tests
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation
          test
          -Dcheckstyle.skip=true
          -Denforcer.skip=true
