name: Federation unit tests

on:
  push:
    branches: [2.5.5]
  pull_request:
    branches: [2.5.5]
  workflow_dispatch:

jobs:
  federation-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PicketLink
        uses: actions/checkout@v5

      - name: Checkout PicketBox 5.0.3.jdk17.1
        uses: actions/checkout@v5
        with:
          repository: martinhickson/picketbox
          ref: 5.0.3
          path: .ci/picketbox

      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            17
          cache: maven

      # PicketBox 5.0.3.jdk17.1 is not published to Maven Central. Its sources
      # target 1.8, and the jboss-logging processor needs javax.annotation.Generated,
      # which JDK 17 no longer provides. Compile it with JDK 8; run the tests on 17.
      - name: Install PicketBox
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -f .ci/picketbox/pom.xml
          -pl picketbox -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Build federation dependencies
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation -am
          install
          -DskipTests
          -Dcheckstyle.skip=true
          -Denforcer.skip=true

      - name: Run federation unit tests
        run: >
          mvn -B -s .github/maven-ci-settings.xml
          -pl modules/federation
          test
          -Dcheckstyle.skip=true
          -Denforcer.skip=true
